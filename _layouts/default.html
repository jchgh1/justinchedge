<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | absolute_url }}?v=20261124">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | absolute_url }}">{{ site.title }}</a>
      </header>

      <main>{{ content }}</main>

    </div>
    <script src="{{ '/assets/js/site.js' | absolute_url }}?v=20261124" defer></script>
  </body>
</html>
