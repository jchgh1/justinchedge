<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">{% seo %}<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"><script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script></head>
<body><header class="site-header"><div class="header-inner"><a class="site-name" href="{{ '/' | relative_url }}">Justin Hedge</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"><span class="sun-icon" aria-hidden="true">☀️</span><span class="moon-icon" aria-hidden="true">🌙</span></button></div></header>{{ content }}<script>(()=>{const root=document.documentElement,button=document.getElementById('theme-toggle');const apply=theme=>{root.setAttribute('data-theme',theme);const dark=theme==='dark';root.style.setProperty('--bg',dark?'#000':'#fff');root.style.setProperty('--surface',dark?'#111':'#f7f8fa');root.style.setProperty('--text',dark?'#f3f4f6':'#17191d');root.style.setProperty('--muted',dark?'#969ba4':'#777d87');root.style.setProperty('--line',dark?'#26282d':'#e9ebef');root.style.setProperty('--accent',dark?'#80aaff':'#2864dc');root.style.setProperty('--accent-soft',dark?'#151f35':'#edf3ff');button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('theme',theme)}catch(e){}};apply(root.getAttribute('data-theme')||'light');button.addEventListener('click',()=>apply(root.getAttribute('data-theme')==='dark'?'light':'dark'))})();</script><script src="{{ '/assets/js/site.js' | relative_url }}" defer></script></body></html>
