<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("site-theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | absolute_url }}?v=20261124-3">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <span class="header-balance" aria-hidden="true"></span>
        <a class="wordmark" href="{{ '/' | absolute_url }}">{{ site.title }}</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
          <span aria-hidden="true" data-theme-icon>☾</span>
        </button>
      </header>

      <main>{{ content }}</main>

    </div>
    <script src="{{ '/assets/js/site.js' | absolute_url }}?v=20261124-3" defer></script>
  </body>
</html>
