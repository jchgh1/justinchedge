<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} — Justin Hedge</title>
  <style>
    * { box-sizing:border-box; }
    body { width:min(47ch, calc(100% - 32px)); margin:clamp(28px, 7vh, 58px) auto; color:#292d31; background:#f1f2f0; font:18px/1.7 "Palatino Linotype", "Book Antiqua", Georgia, serif; }
    header { padding-bottom:12px; border-bottom:3px double #718296; }
    header a { color:#27394c; text-decoration:none; font-size:36px; }
    nav { display:flex; flex-wrap:wrap; gap:7px; margin:17px 0 48px; padding:9px; background:#dce2e8; border:1px solid #a4b1bd; font:bold 16px/1.4 "Palatino Linotype", "Book Antiqua", Georgia, serif; }
    nav a { display:inline-block; padding:7px 11px; color:#fff; background:#2f4866; border:2px outset #8194a8; text-decoration:none; }
    nav a:link, nav a:visited { color:#fff; }
    nav a:hover { color:#fff; background:#35577d; border-style:inset; }
    nav a[aria-current="page"] { position:relative; margin-left:17px; }
    nav a[aria-current="page"]::before { content:">>"; position:absolute; right:calc(100% + 5px); top:50%; transform:translateY(-50%); color:#2f4866; white-space:nowrap; }
    a:link { color:#3f586e; } a:visited { color:#5b5872; } a:hover { color:#223e5a; }
    h1, h2, h3 { color:#27394c; font-weight:bold; line-height:1.25; }
    h1 { font-size:30px; } h2 { font-size:25px; }
    .date { color:#626a70; font-size:15px; }
    blockquote { margin-left:0; padding-left:18px; border-left:2px solid #718296; color:#4a5057; }
    @media (max-width:480px) { body { margin:28px auto; font-size:17px; } header a { font-size:32px; } nav { margin-bottom:38px; gap:6px; font-size:15px; } nav a { padding:6px 8px; } }
  </style>
</head>
<body>
  <header><a href="/">Justin Hedge</a></header>
  <nav aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/where/">Where is Justin?</a>
    <a href="/writings/" {% if page.collection == "writings" %}aria-current="page"{% endif %}>Writings</a>
    <a href="/photography/">Photography</a>
    <a href="/quotes/" {% if page.collection == "quotes" %}aria-current="page"{% endif %}>Quotes</a>
    <a href="/about/">About</a>
  </nav>
  <main>
    <h1>{{ page.title | escape }}</h1>
    {% if page.date %}<p class="date">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
    {{ content }}
  </main>
</body>
</html>
