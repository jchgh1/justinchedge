---
layout: default
---
<main class="article-shell"><a class="back-link" href="{{ '/' | relative_url }}">Home</a><article class="article">{% if page.image %}<img class="article-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}<header class="article-header"><div class="article-byline"><span class="profile-photo"><img class="profile-image" src="{{ '/assets/IMG_4732.jpg' | relative_url }}" alt="" width="44" height="44" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="profile-fallback" hidden>JC</span></span><div><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div><button class="share-button" type="button" data-share-url="{{ page.url | absolute_url }}" data-share-title="{{ page.title | escape }}" data-share-text="{{ page.description | default: page.title | escape }}" aria-label="Share post: {{ page.title | escape }}" title="Share post"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"></path></svg></button><span class="share-status" aria-live="polite"></span></div><h1>{{ page.title }}</h1>{% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}</header><div class="prose">{{ content }}</div></article></main>
