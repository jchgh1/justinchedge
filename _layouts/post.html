---
layout: default
---
<main class="article-shell"><a class="back-link" href="{{ '/' | relative_url }}"><span aria-hidden="true">←</span> All writing</a><article class="article"><header class="article-header"><div class="article-byline"><img class="profile-image" src="{{ '/assets/IMG_4732.jpg' | relative_url }}" alt="Justin Chedge" width="44" height="44"><div><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div></div><h1>{{ page.title }}</h1>{% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}<span class="format-pill">{{ page.format | default: "Note" }}</span></header><div class="prose">{{ content }}</div></article></main>
