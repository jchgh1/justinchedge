---
layout: default
---
<main class="article-shell"><a class="back-link" href="{{ '/' | relative_url }}">Home</a><article class="article">{% if page.image %}<img class="article-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}<header class="article-header"><div class="article-byline"><span class="profile-photo"><img class="profile-image" src="{{ '/assets/IMG_4732.jpg' | relative_url }}" alt="" width="44" height="44" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="profile-fallback" hidden>JH</span></span><div><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div><button class="share-button" type="button" data-share-url="{{ page.url | absolute_url }}" data-share-title="{{ page.title | escape }}" data-share-text="{{ page.description | default: page.title | escape }}" aria-label="Share post: {{ page.title | escape }}" title="Share post">Share</button><span class="share-status" aria-live="polite"></span></div>{% unless page.format == 'text' %}<h1>{{ page.title }}</h1>{% endunless %}</header><div class="prose">{{ content }}</div></article></main>
