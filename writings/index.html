<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writings — Justin Hedge</title>
  <style>
    * { box-sizing:border-box; }
    body { width:min(47ch, calc(100% - 32px)); margin:clamp(28px, 7vh, 58px) auto; color:#292d31; background:#f1f2f0; font:18px/1.7 "Palatino Linotype", "Book Antiqua", Georgia, serif; }
    header { padding-bottom:12px; border-bottom:3px double #718296; }
    h1 { margin:0; color:#27394c; font-size:40px; font-weight:normal; letter-spacing:-.035em; }
    h1 a { color:inherit; text-decoration:none; }
    nav { display:flex; flex-wrap:wrap; gap:7px; margin:17px 0 48px; padding:9px; background:#dce2e8; border:1px solid #a4b1bd; font:bold 16px/1.4 "Palatino Linotype", "Book Antiqua", Georgia, serif; }
    nav a { display:inline-block; padding:7px 11px; color:#fff; background:#2f4866; border:2px outset #8194a8; text-decoration:none; }
    nav a:link, nav a:visited { color:#fff; }
    nav a:hover { color:#fff; background:#35577d; border-style:inset; }
    nav a[aria-current="page"] { position:relative; margin-left:17px; }
    nav a[aria-current="page"]::before { content:">>"; position:absolute; right:calc(100% + 5px); top:50%; transform:translateY(-50%); color:#2f4866; white-space:nowrap; }
    a:link { color:#3f586e; } a:visited { color:#5b5872; } a:hover { color:#223e5a; }
    main h2 { display:table; margin:0 0 15px; padding-bottom:4px; color:#27394c; border-bottom:1px solid #aeb8c1; font-size:27px; font-weight:normal; }
    ul { margin:0; padding-left:22px; } li { margin:0 0 7px; }
    @media (max-width:480px) { body { margin:28px auto; font-size:17px; } nav { margin-bottom:38px; gap:6px; font-size:15px; } nav a { padding:6px 8px; } h1 { font-size:35px; } }
  </style>
</head>
<body>
  <header><h1><a href="../">Justin Hedge</a></h1></header>
  <nav aria-label="Main navigation">
    <a href="../">Home</a>
    <a href="../where/">Where is Justin?</a>
    <a href="./" aria-current="page">Writings</a>
    <a href="../photography/">Photography</a>
    <a href="../quotes/">Quotes</a>
    <a href="../about/">About</a>
  </nav>
  <main aria-label="Writings">
    <ul>
      {% assign entries = site.writings | sort: "date" | reverse %}
      {% for entry in entries %}
      <li><a href="{{ entry.url | relative_url }}">{{ entry.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
