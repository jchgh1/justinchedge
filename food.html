<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food — Justin Hedge</title>

<style>
  :root {
    --cream: #F2EDE3;
    --ink: #2B2823;
    --ink-soft: #6B6559;
    --line: #DCD5C4;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    padding: 60px 24px;
  }

  .container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
  }

  .back {
    display: inline-block;
    color: var(--ink-soft);
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 60px;
  }

  .back:hover {
    color: var(--ink);
  }

  h1 {
    font-size: 30px;
    font-weight: 400;
    margin: 0 0 50px;
  }

  .food-list {
    border-top: 1px solid var(--line);
  }

  .food-entry {
    display: block;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 18px;
    transition: padding-left 0.15s ease;
  }

  .food-entry:hover {
    padding-left: 8px;
  }
</style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">← back</a>

  <h1>food</h1>

  <div class="food-list">

    <a href="food/001.html" class="food-entry">
        Alexander Michael's 
    </a>

  </div>

</div>

</body>
</html>
