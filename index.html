---
layout: default
title: Home
---

<section class="home">
  <h1>{{ site.title }}</h1>
  <p class="home-description">{{ site.description }}</p>

  {% assign latest = site.posts.first %}
  {% if latest %}
    <section class="latest" aria-labelledby="latest-heading">
      <h2 id="latest-heading">Latest</h2>
      <p class="post-date"><time datetime="{{ latest.date | date_to_xmlschema }}">{{ latest.date | date: "%B %-d, %Y" }}</time></p>
      <h3><a href="{{ latest.url | relative_url }}">{{ latest.title }}</a></h3>
      {% if latest.description %}<p class="post-summary">{{ latest.description }}</p>{% endif %}
      <a class="read-link" href="{{ latest.url | relative_url }}">Read →</a>
    </section>
  {% endif %}
</section>
