<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>Where Is Justin?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Where Is Justin?</h1>
    <h2 id="country-name">Loading…</h2>

        <g id="country-shape"></g>
      </svg>
      <p id="map-message">Loading map…</p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="app.js"></script>
</body>
</html>
